name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build desktop/RemoteKeyboard.slnx -c Release
      - run: dotnet run --project desktop/tests/RemoteKeyboard.Core.Tests -c Release --no-build
      - run: dotnet publish desktop/RemoteKeyboard.Windows -c Release -r win-x64 --self-contained -o artifacts/windows
      - run: dotnet list desktop/RemoteKeyboard.slnx package --vulnerable --include-transitive

  android:
    runs-on: windows-2025
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          $sdkManager = Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin/sdkmanager.bat'
          & $sdkManager 'platforms;android-37.0' 'build-tools;36.0.0'
          exit $LASTEXITCODE
      - run: .\gradlew.bat --no-daemon lintDebug testDebugUnitTest assembleDebug
